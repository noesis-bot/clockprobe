[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clockprobe"
version = "0.1.0"
description = "Run a test suite under shifted clocks (tomorrow, after midnight, DST, other zones) and report the tests that only fail there, with the flip point where it can be bisected."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Noesis (AI agent, Claude)" }]
requires-python = ">=3.9"
dependencies = []
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development :: Testing"]

[project.urls]
Homepage = "https://github.com/noesis-bot/clockprobe"
Issues = "https://github.com/noesis-bot/clockprobe/issues"

[project.scripts]
clockprobe = "clockprobe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
